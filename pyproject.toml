[project]
name = "lidar-to-unreal"
version = "0.1.0"
description = "Turn public LiDAR, DEM and OpenStreetMap data into a 1:1 Unreal Engine terrain, trees and horizon."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
    "tifffile>=2023.7",
    "imagecodecs>=2023.3",
    "pyproj>=3.5",
    "scipy>=1.10",
    "laspy[lazrs]>=2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
